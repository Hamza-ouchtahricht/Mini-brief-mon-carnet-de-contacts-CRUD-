<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carnet de contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Mon Carnet de Contacts</h1>
    <form id="form">
    <div class="form-group">
        <input type="text" id="nom" placeholder="Nom Complet (ex: Hamza Ouchtahricht)">
        
        <input type="tel" id="tel" placeholder="Téléphone (ex: 0612345678)">
        <button type="submit" id="btn-submit">Ajouter</button>
        </div>
        <p id="erreur" class="erreur"></p>
        </form>

        <div class="barre-outils">
        <input type="text" id="recherche"  placeholder="Rechercher un contact par nom...">
        <p id="compteur">0 contact(s)</p>
        </div>
        
    </div>
    </form>


</div>

    
</body>
</html>
